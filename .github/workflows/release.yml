name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            asset_name: url-shortener-windows.exe
          - os: ubuntu-latest
            asset_name: url-shortener-linux
          - os: macos-latest
            asset_name: url-shortener-macos

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyshorteners

    - name: Build executable
      run: |
        pyinstaller --onefile --paths src/url_shortener --collect-submodules pyshorteners --name url-shortener src/url_shortener/cli.py

    - name: Rename executable
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv dist/url-shortener.exe dist/${{ matrix.asset_name }}
        else
          mv dist/url-shortener dist/${{ matrix.asset_name }}
        fi

    - name: Release Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
